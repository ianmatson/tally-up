<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tally Up · Group workout goals with friends</title>
    <meta name="description" content="Set a shared workout goal with your friends, log every rep and mile, and always know if the crew is on pace. Free for friend groups." />
    <link rel="canonical" href="https://tally.ianm.app/" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var accent = localStorage.getItem('tally-up:accent')
        if (/^#[0-9a-f]{6}$/i.test(accent)) document.documentElement.style.setProperty('--highlight', accent)
      } catch (e) {}
      addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)) return
        try {
          if (sessionStorage.getItem('tally-up:reloaded')) return
          sessionStorage.setItem('tally-up:reloaded', '1')
        } catch (e) {
          return
        }
        location.reload()
      }, true)
    </script>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-title" content="Tally Up" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tally Up" />
    <meta property="og:url" content="https://tally.ianm.app/" />
    <meta property="og:title" content="Tally Up · Hit your goals together" />

    <meta property="og:image" content="https://tally.ianm.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tally Up: Hit your goals together. A dashboard showing 53% complete and 4.5 days behind pace." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tally Up · Hit your goals together" />
    <meta name="twitter:description" content="Group workout goals with friends. Log every rep and mile, and know if the crew is on pace." />
    <meta name="twitter:image" content="https://tally.ianm.app/og.png" />
