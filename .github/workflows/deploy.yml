name: Deploy Tally Up

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tally-up-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Deploy the existing Cloudflare Worker
        # Routes and cron settings are managed separately, outside the deploy token's scope.
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$(mktemp)"
          trap 'rm -f "$WRANGLER_OUTPUT_FILE_PATH"' EXIT
          npm exec -- wrangler versions upload --keep-vars
          version_id="$(jq -ers '[.[] | select(.type == "version-upload")][-1].version_id | strings | select(test("^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$"))' "$WRANGLER_OUTPUT_FILE_PATH")"
          npm exec -- wrangler versions deploy "${version_id}@100%" --name tally-up --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
